<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Painel administrativo{% endblock %} — {{ nome_empresa }}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
<div class="admin-shell">

  <aside class="admin-lateral">
    <div class="admin-marca">
      <img class="mark" src="{{ url_for('static', filename='img/logo-vitta-full.png') }}" alt="">
      <span>{{ nome_empresa }}</span>
    </div>
    <nav class="admin-nav">
      <a href="{{ url_for('admin_dashboard') }}" class="{{ 'ativo' if request.endpoint == 'admin_dashboard' }}">Painel</a>
      <a href="{{ url_for('admin_pedidos') }}" class="{{ 'ativo' if request.endpoint == 'admin_pedidos' }}">Pedidos</a>
      <a href="{{ url_for('admin_produtos') }}" class="{{ 'ativo' if request.endpoint in ['admin_produtos','admin_produto_novo','admin_produto_editar'] }}">Cardápio</a>
      <a href="{{ url_for('admin_categorias') }}" class="{{ 'ativo' if request.endpoint == 'admin_categorias' }}">Categorias</a>
      <a href="{{ url_for('index') }}" target="_blank" rel="noopener">Ver site ↗</a>
      <a href="{{ url_for('admin_logout') }}">Sair</a>
    </nav>
  </aside>

  <div class="admin-conteudo">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
    {% if mensagens %}
    <div class="flash-container">
      {% for categoria, msg in mensagens %}
      <div class="flash flash-{{ categoria }}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block admin_content %}{% endblock %}
  </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Painel administrativo</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
  <div class="login-caixa">
    <img class="mark" src="{{ url_for('static', filename='img/logo-vitta-full.png') }}" alt="" style="width:64px; height:64px; margin-bottom:14px;">
    <h1>Painel administrativo</h1>
    <p class="login-sub">{{ nome_empresa }}</p>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
    {% if mensagens %}
    <div class="flash-container">
      {% for categoria, msg in mensagens %}
      <div class="flash flash-{{ categoria }}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST" class="form">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" required autofocus>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>

      <button type="submit" class="btn btn-dark" style="margin-top:20px;">Entrar</button>
    </form>
    <p class="login-voltar"><a href="{{ url_for('index') }}">&larr; Voltar ao site</a></p>
  </div>
</body>
</html>
